name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependencias
        run: |
          npm install

      - name: 6. Crear plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Permisos de ejecucion a Gradle
        run: |
          chmod +x android/gradlew

      - name: 8. Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 9. Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: MiPastillero-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
